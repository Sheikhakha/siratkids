<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <script>!function(){try{if(localStorage.getItem("dark-mode")==="true"){document.documentElement.setAttribute("data-theme","dark")}}catch(e){}}()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader | SiratKids</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quran-reader.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preload" href="js/quran_source/indopak-nastaleeq-verse.js" as="script">
    <link rel="preload" href="js/quran_source/taqi-ud-din-al-hilali-muhsin-khan-inline-footnotes.js" as="script">
    <link rel="preload" href="js/quran_source/surah-info-en.js" as="script">
    <link rel="preload" href="js/quran_source/surah-info-ta.js" as="script">
    <link rel="preload" href="js/quran_source/ayah-themes.js" as="script">
    <link rel="preload" href="js/quran_source/mutashabihat.js" as="script">
    <link rel="preload" href="js/quran_source/similar-ayah.js" as="script">
</head>
<body class="disable-onload-animations font-nastaleeq">

    <nav class="qr-navbar">
        <div class="qr-nav-left">
            <button class="qr-sidebar-toggle" id="qr-sidebar-toggle" aria-label="Toggle surah list">
                <svg class="icon-sidebar-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="3"/>
                    <line x1="7" y1="2" x2="7" y2="22"/>
                </svg>
                <svg class="icon-sidebar-closed" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <rect x="2" y="2" width="20" height="20" rx="3"/>
                    <line x1="7" y1="2" x2="7" y2="22"/>
                    <path d="M7,2 L5,2 A3,3 0 0,1 2,5 L2,19 A3,3 0 0,1 5,22 L7,22 Z" fill="currentColor" stroke="none"/>
                </svg>
            </button>
            <a href="index.html" class="qr-nav-logo">
                <img src="images/logo.png" alt="SiratKids" class="qr-nav-logo-img">
                <span class="qr-nav-brand">SiratKids</span>
            </a>
        </div>
        <div class="qr-nav-right">
            <div class="qr-nav-group">
                <label class="qr-nav-label" for="qr-reciter">Reciter:</label>
                <select id="qr-reciter" class="qr-nav-select">
                    <option value="Sudais">Sudais</option>
                    <option value="Shuraim">Shuraim</option>
                    <option value="Alafasy">Al-Afasy</option>
                    <option value="YasserAlDosari">Yasser Al-Dosari</option>
                </select>
            </div>
            <div class="qr-nav-group">
                <label class="qr-nav-label" for="qr-translation">Translation:</label>
                <select id="qr-translation" class="qr-nav-select"></select>
            </div>
            <div class="qr-nav-group">
                <label class="qr-nav-label" for="qr-tafsir-lang">Tafsir:</label>
                <select id="qr-tafsir-lang" class="qr-nav-select">
                    <option value="ta">Tamil</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="qr-nav-group">
                <label class="qr-wbw-toggle" id="qr-wbw-toggle-label">
                    <input type="checkbox" id="qr-wbw-toggle">
                    <span class="qr-wbw-slider"></span>
                    <span class="qr-wbw-label">Word-by-Word</span>
                </label>
                <select id="qr-wbw-lang" class="qr-wbw-lang-select">
                    <option value="auto">Auto</option>
                    <option value="en">English</option>
                    <option value="ta">Tamil</option>
                </select>
            </div>
            <button class="qr-mushaf-nav-btn" id="qr-mushaf-open" aria-label="Open Mushaf view" title="Mushaf view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Mushaf</span>
            </button>
            <button class="dm-toggle" aria-label="Toggle dark mode">
                <svg class="dm-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="dm-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
    </nav>

    <div class="qr-layout">
        <aside class="qr-sidebar" id="qr-sidebar">
            <div class="qr-sidebar-header">
                <h2>Surahs</h2>
                <input type="text" class="qr-surah-search" id="qr-surah-search" placeholder="Search surahs...">
            </div>
            <div class="qr-surah-list" id="qr-surah-list"></div>
        </aside>

        <main class="qr-main" id="qr-main">
            <div class="qr-loading" id="qr-loading">
                <div class="qr-loading-spinner"></div>
                <p>Loading Quran...</p>
            </div>
            <div class="qr-content" id="qr-content" style="display:none;">
                <div class="qr-surah-header" id="qr-surah-header"></div>
                <div class="qr-verses" id="qr-verses"></div>
            </div>

            <div class="qr-fixed-play-bar active" id="qr-fixed-play-bar">
                <div class="qr-playbar-eq" id="qr-playbar-eq">
                    <span class="qr-eq-bar"></span>
                    <span class="qr-eq-bar"></span>
                    <span class="qr-eq-bar"></span>
                </div>
                <div class="qr-playbar-info">
                    <span class="qr-playbar-surah" id="qr-playbar-surah">Surah</span>
                    <span class="qr-playbar-verse" id="qr-playbar-verse">Verse</span>
                </div>
                <div class="qr-playbar-controls">
                    <button class="qr-playbar-btn" id="qr-playbar-prev" aria-label="Previous" title="Previous verse">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="19,20 9,12 19,4"/></svg>
                    </button>
                    <button class="qr-playbar-btn qr-playbar-playpause" id="qr-playbar-playpause" aria-label="Play" title="Play / Pause">
                        <svg class="qr-playbar-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                        <svg class="qr-playbar-pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="qr-playbar-btn qr-playbar-stop" id="qr-playbar-stop" aria-label="Stop" title="Stop">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                    <button class="qr-playbar-btn" id="qr-playbar-next" aria-label="Next" title="Next verse">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5,4 15,12 5,20"/></svg>
                    </button>
                </div>
            </div>

            <button class="qr-mushaf-fab" id="qr-mushaf-fab" aria-label="Open Mushaf view" title="Mushaf view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Mushaf</span>
            </button>

            <div class="qr-continue-prompt" id="qr-continue-prompt" style="display:none;">
                <span>Continue continuous recitation?</span>
                <button class="qr-continue-yes" id="qr-continue-yes">Yes</button>
                <button class="qr-continue-no" id="qr-continue-no">No</button>
            </div>

            <div class="qr-nav-bottom" id="qr-nav-bottom" style="display:none;">
                <button class="qr-nav-btn" id="qr-prev-surah">&#8592; Previous</button>
                <div class="qr-nav-center">
                    <span class="qr-clear-cache" id="qr-clear-cache">Clear cached data</span>
                    <span class="qr-attribution">Powered by <a href="https://tarteel.ai" target="_blank" rel="noopener">Tarteel AI</a></span>
                </div>
                <button class="qr-nav-btn qr-nav-btn-primary" id="qr-next-surah">Next &#8594;</button>
            </div>
        </main>
    </div>

    <!-- Footnote tooltip (inline footnote popups) -->
    <div class="qr-fn-tooltip" id="qr-fn-tooltip"></div>

    <!-- Tafsir modal popup -->
    <div class="qr-tafsir-modal-backdrop" id="qr-tafsir-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-tafsir-modal" role="dialog" aria-modal="true" aria-label="Tafsir">
            <div class="qr-tafsir-modal-head">
                <button class="qr-tafsir-nav" id="qr-tafsir-prev" aria-label="Previous verse" title="Previous verse">&#8249;</button>
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-tafsir-surah-ar"></span>
                    <span id="qr-tafsir-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span id="qr-tafsir-verse"></span>
                </div>
                <select class="qr-tafsir-jump" id="qr-tafsir-jump" aria-label="Jump to verse"></select>
                <button class="qr-tafsir-nav" id="qr-tafsir-next" aria-label="Next verse" title="Next verse">&#8250;</button>
                <button class="qr-tafsir-pin" id="qr-tafsir-pin" aria-pressed="false" title="Pin (keep open)"></button>
                <button class="qr-tafsir-close" id="qr-tafsir-close" aria-label="Close tafsir">&#10005;</button>
            </div>
            <div class="qr-tafsir-modal-controls">
                <label class="qr-tafsir-modal-lang">
                    <span class="qr-tafsir-modal-label">Language:</span>
                    <select id="qr-tafsir-modal-lang" aria-label="Tafsir language">
                        <option value="ta">Tamil</option>
                        <option value="en">English</option>
                    </select>
                </label>
                <div class="qr-tafsir-size">
                    <span class="qr-tafsir-size-aa">Aa</span>
                    <button id="qr-tafsir-size-down" aria-label="Decrease text size">A&#8722;</button>
                    <button id="qr-tafsir-size-up" aria-label="Increase text size">A+</button>
                </div>
            </div>
            <div class="qr-tafsir-modal-body" id="qr-tafsir-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-tafsir-modal-source"></div>
        </div>
    </div>

    <!-- Mutashabihat / Similar Ayat modal popup (styled identically to the Tafsir modal) -->
    <div class="qr-tafsir-modal-backdrop" id="qr-mutashabihat-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-mutashabihat-modal" role="dialog" aria-modal="true" aria-label="Similar Ayat">
            <div class="qr-tafsir-modal-head">
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-sim-surah-ar"></span>
                    <span id="qr-sim-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span id="qr-sim-verse"></span>
                </div>
                <button class="qr-tafsir-close" id="qr-sim-close" aria-label="Close similar ayat">&#10005;</button>
            </div>
            <div class="qr-sim-modal-body" id="qr-sim-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-sim-modal-source"></div>
        </div>
    </div>

    <!-- Surah Information modal popup (full bilingual overview, styled like the Tafsir modal) -->
    <div class="qr-tafsir-modal-backdrop" id="qr-surah-info-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-surah-info-modal" role="dialog" aria-modal="true" aria-label="Surah Information">
            <div class="qr-tafsir-modal-head">
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-info-surah-ar"></span>
                    <span id="qr-info-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span>Surah Info</span>
                </div>
                <button class="qr-tafsir-close" id="qr-info-modal-close" aria-label="Close surah information">&#10005;</button>
            </div>
            <div class="qr-info-modal-body" id="qr-info-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-info-modal-source"></div>
        </div>
    </div>

    <!-- Mushaf view overlay -->
    <div class="qr-mushaf-backdrop" id="qr-mushaf-backdrop" hidden>
        <div class="qr-mushaf-frame" id="qr-mushaf-frame" role="dialog" aria-modal="true" aria-label="Mushaf view">
            <div class="qr-mushaf-toolbar">
                <span class="qr-mushaf-title" id="qr-mushaf-title"></span>
                <div class="qr-mushaf-pagenav">
                    <button class="qr-tafsir-nav" id="qr-mushaf-prev" aria-label="Previous page" title="Previous page">&#8249;</button>
                    <span class="qr-mushaf-pageinfo" id="qr-mushaf-pageinfo"></span>
                    <button class="qr-tafsir-nav" id="qr-mushaf-next" aria-label="Next page" title="Next page">&#8250;</button>
                </div>
                <button class="qr-tafsir-close" id="qr-mushaf-close" aria-label="Close mushaf">&#10005;</button>
            </div>
            <div class="qr-mushaf-page" id="qr-mushaf-page" dir="rtl"></div>
        </div>
    </div>

    <script src="js/quran-chapter-data.js"></script>
    <script src="js/quran-reader-cache.js"></script>
    <script>
        window.__QURAN_TRANSLATIONS = {
            hilali: { name: "Al-Hilali & Khan", lang: "en", file: "taqi-ud-din-al-hilali-muhsin-khan-inline-footnotes" },
            saheeh: { name: "Saheeh International", lang: "en", file: "en-sahih-international-simple" },
            baqavi: { name: "Abdul Hameed Baqavi", lang: "ta", file: "abdul-hameed-baqavi-simple" },
            omarSharif: { name: "Omar Sharif bin Abdul Salam", lang: "ta", file: "sheikh-omar-sharif-bin-abdul-salam-simple" }
        };
    </script>
    <script src="js/main.js"></script>
    <script src="js/quran-reader.js"></script>
</body>
</html>
