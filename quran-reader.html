<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader | SiratKids</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quran-reader.css">
    <link rel="stylesheet" href="css/qul-mushaf-fonts.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preload" href="js/quran_source/indopak-nastaleeq-verse.js" as="script">
    <link rel="preload" href="js/quran_source/taqi-ud-din-al-hilali-muhsin-khan-inline-footnotes.js" as="script">
    <link rel="preload" href="js/quran_source/surah-info-en.js" as="script">
    <link rel="preload" href="js/quran_source/surah-info-ta.js" as="script">
    <link rel="preload" href="js/quran_source/ayah-themes.js" as="script">
    <link rel="preload" href="js/quran_source/mutashabihat.js" as="script">
    <link rel="preload" href="js/quran_source/similar-ayah.js" as="script">
</head>
<body class="disable-onload-animations font-nastaleeq">

    <nav class="qr-navbar">
        <div class="qr-nav-left">
            <button class="qr-sidebar-toggle" id="qr-sidebar-toggle" aria-label="Toggle surah list">
                <svg class="icon-sidebar-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="3"/>
                    <line x1="7" y1="2" x2="7" y2="22"/>
                </svg>
                <svg class="icon-sidebar-closed" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <rect x="2" y="2" width="20" height="20" rx="3"/>
                    <line x1="7" y1="2" x2="7" y2="22"/>
                    <path d="M7,2 L5,2 A3,3 0 0,1 2,5 L2,19 A3,3 0 0,1 5,22 L7,22 Z" fill="currentColor" stroke="none"/>
                </svg>
            </button>
            <a href="index.html" class="qr-nav-logo">
                <img src="images/logo.png" alt="SiratKids" class="qr-nav-logo-img">
                <span class="qr-nav-brand">SiratKids</span>
            </a>
        </div>
        <div class="qr-nav-right">
            <div class="qr-nav-group">
                <label class="qr-nav-label" for="qr-reciter">Reciter:</label>
                <select id="qr-reciter" class="qr-nav-select">
                    <option value="Sudais">Sudais</option>
                    <option value="Shuraim">Shuraim</option>
                    <option value="Alafasy">Al-Afasy</option>
                    <option value="YasserAlDosari">Yasser Al-Dosari</option>
                </select>
            </div>
            <span class="qr-nav-sep" aria-hidden="true" data-qr-mushaf-hide></span>
            <div class="qr-nav-group" id="qr-translation-group">
                <label class="qr-nav-label" for="qr-translation">Translation:</label>
                <select id="qr-translation" class="qr-nav-select"></select>
            </div>
            <span class="qr-nav-sep" aria-hidden="true" data-qr-mushaf-hide></span>
            <div class="qr-nav-group" id="qr-wbw-group">
                <label class="qr-wbw-toggle" id="qr-wbw-toggle-label">
                    <input type="checkbox" id="qr-wbw-toggle">
                    <span class="qr-wbw-slider"></span>
                    <span class="qr-wbw-label">Word-by-Word</span>
                </label>
            </div>
            <span class="qr-nav-sep" aria-hidden="true" data-qr-mushaf-hide></span>
            <button class="qr-mushaf-nav-btn" id="qr-mushaf-open" aria-label="Toggle Mushaf view" aria-pressed="false" title="Mushaf view">
                <svg id="qr-mushaf-icon-mushaf" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <svg id="qr-mushaf-icon-trans" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M4 5h16"/><path d="M4 10h16"/><path d="M4 15h10"/><path d="M4 20h7"/></svg>
                <span id="qr-mushaf-btn-label">Mushaf</span>
            </button>
            <div class="qr-nav-group qr-mushaf-group" id="qr-mushaf-group" hidden>
                <label class="qr-nav-label" for="qr-mushaf-layout">Layout:</label>
                <select id="qr-mushaf-layout" class="qr-nav-select" aria-label="Mushaf layout"></select>
                <div class="qr-mushaf-goto-pop-wrap">
                    <button type="button" class="qr-mushaf-goto-pop" id="qr-mushaf-goto-pop"
                            aria-haspopup="dialog" aria-expanded="false"
                            aria-label="Go to verse, page, juz or surah" title="Go to...">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M2 12a10 10 0 0 1 20 0a10 10 0 0 1-20 0z"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
                        <span>Go to</span>
                        <svg class="qr-goto-caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="qr-mushaf-goto-popover" id="qr-mushaf-goto-popover" role="dialog"
                         aria-label="Go to" hidden>
                        <div class="qr-goto-row">
                            <label class="qr-goto-label" for="qr-mushaf-goto-verse">Verse</label>
                            <input type="number" id="qr-mushaf-goto-verse" min="1" step="1" inputmode="numeric"
                                   aria-label="Go to verse number" title="Verse number">
                            <button type="button" class="qr-goto-go" id="qr-mushaf-goto-verse-btn" aria-label="Go to verse">Go</button>
                        </div>
                        <div class="qr-goto-row">
                            <label class="qr-goto-label" for="qr-mushaf-goto-page">Page</label>
                            <input type="number" id="qr-mushaf-goto-page" min="1" step="1" inputmode="numeric"
                                   aria-label="Go to page number" title="Page number">
                            <button type="button" class="qr-goto-go" id="qr-mushaf-goto-page-btn" aria-label="Go to page">Go</button>
                        </div>
                        <div class="qr-goto-row">
                            <label class="qr-goto-label" for="qr-mushaf-goto-juz">Juz</label>
                            <input type="number" id="qr-mushaf-goto-juz" min="1" max="30" step="1" inputmode="numeric"
                                   aria-label="Go to juz number" title="Juz number">
                            <button type="button" class="qr-goto-go" id="qr-mushaf-goto-juz-btn" aria-label="Go to juz">Go</button>
                        </div>
                        <div class="qr-goto-row">
                            <label class="qr-goto-label" for="qr-mushaf-goto-surah">Surah</label>
                            <input type="number" id="qr-mushaf-goto-surah" min="1" max="114" step="1" inputmode="numeric"
                                   aria-label="Go to surah number" title="Surah number">
                            <button type="button" class="qr-goto-go" id="qr-mushaf-goto-surah-btn" aria-label="Go to surah">Go</button>
                        </div>
                    </div>
                </div>
                <label class="qr-mushaf-tajweed-toggle" id="qr-mushaf-tajweed-label" title="Tajweed coloring">
                    <input type="checkbox" id="qr-mushaf-tajweed" checked>
                    <span class="qr-mushaf-tajweed-slider"></span>
                    <span class="qr-mushaf-tajweed-label-text">Tajweed</span>
                </label>
            </div>
            <button class="dm-toggle" aria-label="Toggle dark mode">
                <svg class="dm-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="dm-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <div class="settings-dropdown">
                <button class="settings-toggle-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <div class="settings-dropdown-content">
                    <div class="settings-dropdown-item" data-qr-mushaf-hide>
                        <span class="settings-label">English Size</span>
                        <div class="qr-font-size-group" data-qr-scale="en"></div>
                    </div>
                    <div class="settings-dropdown-item">
                        <span class="settings-label">Arabic Size</span>
                        <div class="qr-font-size-group" data-qr-scale="ar"></div>
                    </div>
                    <div class="settings-dropdown-item" data-qr-mushaf-hide>
                        <span class="settings-label">Word-by-Word Size</span>
                        <div class="qr-font-size-group" data-qr-scale="wbw"></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="qr-layout">
        <aside class="qr-sidebar" id="qr-sidebar">
            <div class="qr-sidebar-header">
                <div class="qr-surah-search-wrap">
                    <input type="text" class="qr-surah-search" id="qr-surah-search" placeholder="Search surah...">
                    <button type="button" class="qr-goto-btn" id="qr-goto-btn" aria-label="Go to surah and verse" title="Go to surah &amp; verse">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="21"/></svg>
                    </button>
                </div>
            </div>
            <div class="qr-surah-list" id="qr-surah-list"></div>
        </aside>

        <main class="qr-main" id="qr-main">
            <div class="qr-loading" id="qr-loading">
                <div class="qr-loading-spinner"></div>
                <p>Loading Quran...</p>
            </div>
            <div class="qr-content" id="qr-content" style="display:none;">
                <div class="qr-surah-header" id="qr-surah-header"></div>
                <div class="qr-verses" id="qr-verses"></div>
            </div>

            <!-- Mushaf (page-based layout) view: rendered from QUL layout bundles.
                 Page-turn buttons flank the page; the page label sits centered
                 below the page (not in the navbar). -->
            <div class="qr-mushaf" id="qr-mushaf" dir="rtl" hidden>
                <button type="button" class="qr-mushaf-turn qr-mushaf-turn-prev" id="qr-mushaf-turn-prev" aria-label="Previous page" title="Previous page">
                    <span class="qr-turn-arrow">&#8249;</span>
                    <span class="qr-turn-label" id="qr-mushaf-turn-prev-label"></span>
                </button>
                <div class="qr-mushaf-inner" id="qr-mushaf-inner"></div>
                <button type="button" class="qr-mushaf-turn qr-mushaf-turn-next" id="qr-mushaf-turn-next" aria-label="Next page" title="Next page">
                    <span class="qr-turn-label" id="qr-mushaf-turn-next-label"></span>
                    <span class="qr-turn-arrow">&#8250;</span>
                </button>
                <div class="qr-mushaf-caption" dir="ltr">
                    <span class="qr-mushaf-page-label" id="qr-mushaf-page-label">Page 1</span>
                </div>
            </div>

            <!-- Tajweed rules legend: an always-visible rail on the left edge of
                 Mushaf view (shown while tajweed coloring is on). Rows are
                 built by buildMushafPalette() from the tajweed-rules bundle. -->
            <aside class="qr-mushaf-palette qr-mushaf-legend" id="qr-mushaf-legend" hidden aria-label="Tajweed rules legend">
                <div class="qr-mushaf-palette-head">
                    <span class="qr-mushaf-palette-title">Tajweed Rules</span>
                </div>
                <div class="qr-mushaf-palette-items" id="qr-mushaf-palette-items"></div>
            </aside>

            <div class="qr-fixed-play-bar active" id="qr-fixed-play-bar">
                <div class="qr-playbar-eq" id="qr-playbar-eq">
                    <span class="qr-eq-bar"></span>
                    <span class="qr-eq-bar"></span>
                    <span class="qr-eq-bar"></span>
                </div>
                <div class="qr-playbar-info">
                    <span class="qr-playbar-surah" id="qr-playbar-surah">Surah</span>
                    <span class="qr-playbar-verse" id="qr-playbar-verse">Verse</span>
                </div>
                <div class="qr-playbar-controls">
                    <button class="qr-playbar-btn" id="qr-playbar-prev" aria-label="Previous" title="Previous verse">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="19,20 9,12 19,4"/></svg>
                    </button>
                    <button class="qr-playbar-btn qr-playbar-playpause" id="qr-playbar-playpause" aria-label="Play" title="Play / Pause">
                        <svg class="qr-playbar-play-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                        <svg class="qr-playbar-pause-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="qr-playbar-btn qr-playbar-stop" id="qr-playbar-stop" aria-label="Stop" title="Stop">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    </button>
                    <button class="qr-playbar-btn" id="qr-playbar-next" aria-label="Next" title="Next verse">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5,4 15,12 5,20"/></svg>
                    </button>
                </div>
            </div>

            <div class="qr-continue-prompt" id="qr-continue-prompt" style="display:none;">
                <span>Continue continuous recitation?</span>
                <button class="qr-continue-yes" id="qr-continue-yes">Yes</button>
                <button class="qr-continue-no" id="qr-continue-no">No</button>
            </div>

            <div class="qr-nav-bottom" id="qr-nav-bottom" style="display:none;">
                <button class="qr-nav-btn" id="qr-prev-surah">&#8592; Previous</button>
                <div class="qr-nav-center">
                    <span class="qr-clear-cache" id="qr-clear-cache">Clear cached data</span>
                    <span class="qr-attribution">Powered by <a href="https://tarteel.ai" target="_blank" rel="noopener">Tarteel AI</a></span>
                </div>
                <button class="qr-nav-btn qr-nav-btn-primary" id="qr-next-surah">Next &#8594;</button>
            </div>
        </main>
    </div>

    <!-- Footnote tooltip (inline footnote popups) -->
    <div class="qr-fn-tooltip" id="qr-fn-tooltip"></div>

    <!-- Tafsir modal popup -->
    <div class="qr-tafsir-modal-backdrop" id="qr-tafsir-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-tafsir-modal" role="dialog" aria-modal="true" aria-label="Tafsir">
            <div class="qr-tafsir-modal-head">
                <button class="qr-tafsir-nav" id="qr-tafsir-prev" aria-label="Previous verse" title="Previous verse">&#8249;</button>
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-tafsir-surah-ar"></span>
                    <span id="qr-tafsir-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span id="qr-tafsir-verse"></span>
                </div>
                <select class="qr-tafsir-jump" id="qr-tafsir-jump" aria-label="Jump to verse"></select>
                <button class="qr-tafsir-nav" id="qr-tafsir-next" aria-label="Next verse" title="Next verse">&#8250;</button>
                <button class="qr-tafsir-pin" id="qr-tafsir-pin" aria-pressed="false" title="Pin (keep open)"></button>
                <button class="qr-tafsir-close" id="qr-tafsir-close" aria-label="Close tafsir">&#10005;</button>
            </div>
            <div class="qr-tafsir-modal-controls">
                <label class="qr-tafsir-modal-lang">
                    <span class="qr-tafsir-modal-label">Language:</span>
                    <select id="qr-tafsir-modal-lang" aria-label="Tafsir language">
                        <option value="ta">Tamil</option>
                        <option value="en">English</option>
                    </select>
                </label>
                <div class="qr-tafsir-size">
                    <span class="qr-tafsir-size-aa">Aa</span>
                    <button id="qr-tafsir-size-down" aria-label="Decrease text size">A&#8722;</button>
                    <button id="qr-tafsir-size-up" aria-label="Increase text size">A+</button>
                </div>
            </div>
            <div class="qr-tafsir-modal-body" id="qr-tafsir-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-tafsir-modal-source"></div>
        </div>
    </div>

    <!-- Mutashabihat / Similar Ayat modal popup (styled identically to the Tafsir modal) -->
    <div class="qr-tafsir-modal-backdrop" id="qr-mutashabihat-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-mutashabihat-modal" role="dialog" aria-modal="true" aria-label="Similar Ayat">
            <div class="qr-tafsir-modal-head">
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-sim-surah-ar"></span>
                    <span id="qr-sim-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span id="qr-sim-verse"></span>
                </div>
                <button class="qr-tafsir-close" id="qr-sim-close" aria-label="Close similar ayat">&#10005;</button>
            </div>
            <div class="qr-tafsir-modal-controls">
                <div class="qr-tafsir-size">
                    <span class="qr-tafsir-size-aa">Aa</span>
                    <button id="qr-sim-size-down" aria-label="Decrease text size">A&#8722;</button>
                    <button id="qr-sim-size-up" aria-label="Increase text size">A+</button>
                </div>
            </div>
            <div class="qr-sim-modal-body" id="qr-sim-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-sim-modal-source"></div>
        </div>
    </div>

    <!-- Surah Information modal popup (full bilingual overview, styled like the Tafsir modal) -->
    <div class="qr-tafsir-modal-backdrop" id="qr-surah-info-modal-backdrop" hidden>
        <div class="qr-tafsir-modal" id="qr-surah-info-modal" role="dialog" aria-modal="true" aria-label="Surah Information">
            <div class="qr-tafsir-modal-head">
                <div class="qr-tafsir-modal-title">
                    <span class="qr-tafsir-modal-title-ar" id="qr-info-surah-ar"></span>
                    <span id="qr-info-surah-en"></span>
                    <span class="qr-tafsir-modal-title-sep">&#183;</span>
                    <span>Surah Info</span>
                </div>
                <button class="qr-tafsir-close" id="qr-info-modal-close" aria-label="Close surah information">&#10005;</button>
            </div>
            <div class="qr-tafsir-modal-controls">
                <label class="qr-tafsir-modal-lang">
                    <span class="qr-tafsir-modal-label">Language:</span>
                    <select id="qr-info-modal-lang" aria-label="Surah info language">
                        <option value="en">English</option>
                        <option value="ta">Tamil</option>
                    </select>
                </label>
                <div class="qr-tafsir-size">
                    <span class="qr-tafsir-size-aa">Aa</span>
                    <button id="qr-info-size-down" aria-label="Decrease text size">A&#8722;</button>
                    <button id="qr-info-size-up" aria-label="Increase text size">A+</button>
                </div>
            </div>
            <div class="qr-info-modal-body" id="qr-info-modal-body"></div>
            <div class="qr-tafsir-modal-source" id="qr-info-modal-source"></div>
        </div>
    </div>

    <!-- Go to surah & verse dialog -->
    <div class="qr-goto-backdrop" id="qr-goto-backdrop" hidden>
        <div class="qr-goto-dialog" role="dialog" aria-modal="true" aria-label="Go to surah and verse">
            <div class="qr-goto-head">
                <div class="qr-goto-title">Go to surah &amp; verse</div>
                <button type="button" class="qr-tafsir-close" id="qr-goto-close" aria-label="Close go to dialog">&#10005;</button>
            </div>
            <div class="qr-goto-body">
                <form id="qr-goto-form" novalidate>
                    <label class="qr-goto-label" for="qr-goto-surah">Surah</label>
                    <select class="qr-goto-select" id="qr-goto-surah"></select>
